# Render Blueprint for the backend API.
# Render dashboard > New > Blueprint > pick this repo.
services:
  - type: web
    name: code-xray-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Comma-separated frontend origins, e.g. https://code-xray.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
